# /etc/nginx/sites-available/sovga — замените sovga.uz на свой домен.
# Сертификат выпускает certbot (docs/deploy.md, шаг 8).

server {
    listen 80;
    server_name sovga.uz www.sovga.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sovga.uz www.sovga.uz;

    ssl_certificate /etc/letsencrypt/live/sovga.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sovga.uz/privkey.pem;

    client_max_body_size 10m;

    # Статика админки Django (manage.py collectstatic)
    location /static/ {
        alias /srv/sovga/backend/staticfiles/;
        expires 30d;
    }

    # API, колбэки Payme/Click и админка — в Django. X-Real-IP — для лимитов запросов по посетителю,
    # X-Forwarded-Proto — чтобы Django знал, что снаружи HTTPS (оба заголовка nginx перезаписывает).
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Всё остальное — витрина Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
